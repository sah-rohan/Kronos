<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6db4e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e3a5c" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Source+Serif+4:opsz,wght@8..60,300..600&display=swap"
      rel="stylesheet"
    />
    <title>Kronos - a Neetcode problems tracker</title>
    <meta name="description" content="Group progress tracker for the NeetCode 250." />
    <script>
      (function () {
        try {
          var h = new Date().getHours();
          document.documentElement.classList.toggle("dark", h >= 19 || h < 7);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

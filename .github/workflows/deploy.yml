name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Authenticate to the private forge module
        run: |
          git config --global url."https://x-access-token:${{ secrets.FORGE_TOKEN }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE='github.com/sah-rohan/*'

      - name: Build lambda zips
        run: ./build.sh
        working-directory: backend

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: kronos-deploy-${{ github.run_id }}
          retry-max-attempts: 2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=kronos/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform apply -auto-approve -var "aws_region=$AWS_REGION"
          echo "API_URL=$(terraform output -raw api_url)" >> "$GITHUB_ENV"
          echo "FRONTEND_BUCKET=$(terraform output -raw frontend_bucket)" >> "$GITHUB_ENV"
          echo "CF_DIST=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_ENV"
          echo "::notice title=Site URL::$(terraform output -raw frontend_url)"
          terraform output -raw database_url > /tmp/dburl

      - name: Load schema, seed, and admin
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          DBURL="$(cat /tmp/dburl)"
          psql "$DBURL" -f backend/db/schema.sql
          psql "$DBURL" -f backend/db/seed_problems.sql
          if [ -n "${{ secrets.ADMIN_CLERK_ID }}" ]; then
            psql "$DBURL" -c "insert into users (clerk_id, display_name, status, role) values ('${{ secrets.ADMIN_CLERK_ID }}', 'Admin', 'approved', 'admin') on conflict (clerk_id) do update set status='approved', role='admin';"
          fi

      - name: Read Clerk publishable key from Parameter Store
        run: |
          PK=$(aws ssm get-parameter --name /kronos/CLERK_PUBLISHABLE_KEY --query 'Parameter.Value' --output text)
          echo "::add-mask::$PK"
          echo "VITE_CLERK_PUBLISHABLE_KEY=$PK" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build frontend
        run: npm ci && npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ env.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Publish frontend
        run: |
          aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$CF_DIST" --paths '/*'
